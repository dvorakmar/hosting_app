# ============================================
# Admin Panel - Docker Compose Configuration
# Nginx (Reverse Proxy) + PHP-FPM Backend
# ============================================

services:
  # --- Nginx Reverse Proxy & Entry Point ---
  nginx:
    image: nginx:alpine
    container_name: webhosting-nginx
    restart: unless-stopped
    ports:
      - "${ADMIN_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/10-resolver.sh:/docker-entrypoint.d/10-resolver.sh:ro
      - ../admin-web:/var/www/html:ro
    depends_on:
      php-fpm:
        condition: service_healthy
    networks:
      - webhosting-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # --- PHP-FPM (Admin Panel Backend + Provisioning Runner) ---
  php-fpm:
    build:
      context: ./php
      dockerfile: Dockerfile
    container_name: webhosting-php-fpm
    restart: unless-stopped
    volumes:
      - ../admin-web:/var/www/html:rw
      - ..:/opt/own_hosting:rw
      - ../scripts:/scripts:ro
      - ../clients:/clients:rw
      - ../data:/data:rw
      - ../.env:/.env:ro
      - /var/run/docker.sock:/var/run/docker.sock:rw
    environment:
      MYSQL_HOST: "${MYSQL_HOST:-127.0.0.1}"
      MYSQL_PORT: "${MYSQL_PORT:-3306}"
      MYSQL_USER: "${MYSQL_USER:-webhosting_admin}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
      MYSQL_DEPROVISION_USER: "${MYSQL_DEPROVISION_USER:-deprovision_admin}"
      MYSQL_DEPROVISION_PASSWORD: "${MYSQL_DEPROVISION_PASSWORD}"
      ADMIN_DB_NAME: "${ADMIN_DB_NAME:-webhosting_admin_db}"
      ADMIN_DB_USER: "${ADMIN_DB_USER:-admin_user}"
      ADMIN_DB_PASSWORD: "${ADMIN_DB_PASSWORD}"
      SERVER_IP: "${SERVER_IP:-192.168.1.100}"
      ADMIN_PORT: "${ADMIN_PORT:-8080}"
      PROJECT_ROOT: "/opt/own_hosting"
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - webhosting-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  webhosting-network:
    name: webhosting-network
    driver: bridge
