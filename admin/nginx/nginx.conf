# ==============================================================================
# Nginx Reverse Proxy Configuration - Webhosting Manager
# ==============================================================================
# Zajišťuje:
# 1. Směrování administračního panelu (root / a index.php) -> php-fpm:9000
# 2. Dynamické reverzní proxy pro zákaznické WordPress weby (/web1/, /web2/, ...)
# ==============================================================================

server {
    listen 80;
    server_name _;

    # Dynamický DNS resolver (automaticky detekován pro Docker i Podman)
    include /etc/nginx/conf.d/resolver.conf;

    # Maximální velikost nahrávaných souborů (pro WordPress pluginy/šablony/média)
    client_max_body_size 64M;

    # --- Healthcheck endpoint ---
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # --- Klientské WordPress weby (sub-path: /web1, /web2, /webblog, ...) ---
    location ~ ^/(?<site>web[0-9a-z]+)(?<req_uri>/.*)?$ {
        # Pokud chybí koncové lomítko (/web1 -> /web1/), přesměrujeme 301
        if ($req_uri = "") {
            return 301 $scheme://$http_host/$site/;
        }

        # Cílový WordPress kontejner v rámci sdílené docker sítě 'webhosting-network'
        set $wp_upstream "http://${site}-wordpress:80";
        proxy_pass $wp_upstream$req_uri$is_args$args;
        proxy_redirect / /${site}/;

        # Hlavičky předávané WordPress kontejneru
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Prefix /$site;

        # Timeouty pro delší WordPress operace
        proxy_connect_timeout 15s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # Uživatelsky přívětivá stránka při startu nebo nedostupnosti kontejneru
        proxy_intercept_errors on;
        error_page 502 503 504 = @wp_unavailable;
    }

    # Fallback stránka při nedostupnosti WordPress kontejneru
    location @wp_unavailable {
        return 503 "<!DOCTYPE html><html lang='cs'><head><meta charset='utf-8'><title>Webhosting se spouští</title><meta http-equiv='refresh' content='4'><style>body{font-family:system-ui,-apple-system,sans-serif;background:#0f172a;color:#f8fafc;display:flex;align-items:center;justify-content:center;height:100vh;margin:0}div{text-align:center;padding:2rem;background:#1e293b;border-radius:12px;box-shadow:0 10px 25px rgba(0,0,0,0.3);max-width:480px}h2{color:#38bdf8;margin-top:0}p{color:#94a3b8;line-height:1.5}</style></head><body><div><h2>Webhosting se spouští...</h2><p>Požadovaný WordPress kontejner se právě inicializuje nebo nebyl nalezen. Stránka se automaticky obnoví za 4 sekundy.</p></div></body></html>";
        add_header Content-Type text/html;
    }

    # --- Administrační panel (kořenový adresář /) ---
    location / {
        root /var/www/html;
        index index.php index.html;
        try_files $uri $uri/ /index.php?$args;

        # Zpracování PHP skriptů přes FastCGI (PHP-FPM)
        location ~ \.php$ {
            fastcgi_pass php-fpm:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME /var/www/html/$fastcgi_script_name;
            include fastcgi_params;
            fastcgi_read_timeout 180s;
            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;
        }
    }

    # Ochrana skrytých souborů (.git, .env apod.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
